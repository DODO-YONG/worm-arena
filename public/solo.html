<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>꿈틀 아레나</title>
<style>
:root{--bg:#0b0f1a;--panel:rgba(14,20,36,.84);--text:#e8ecf7;--muted:#8a94b2;--accent:#ffd166;--accent2:#ff5d73}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:fixed;pointer-events:none;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#stats{left:16px;bottom:16px;font-size:14px;line-height:1.6}
#stats b{color:var(--accent);font-size:22px}
#board{right:16px;top:16px;background:var(--panel);border-radius:12px;padding:10px 14px;min-width:180px;font-size:13px}
#board h3{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
#board ol{list-style:none}
#board li{display:flex;justify-content:space-between;gap:12px;padding:1px 0;font-weight:500}
#board li.me{color:var(--accent);font-weight:800}
#mini{right:16px;bottom:16px;width:130px;height:130px;border-radius:50%}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(11,15,26,.45),rgba(11,15,26,.88));z-index:10;padding:16px}
.overlay.hidden{display:none}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px 26px 22px;width:min(380px,100%);text-align:center;backdrop-filter:blur(6px)}
.title{font-size:40px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px;margin:6px 0 20px}
input#name{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3);color:var(--text);font-size:16px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
input#name:focus{border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 18px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s}
.sw.on{border-color:#fff;transform:scale(1.15)}
button.play{width:100%;padding:13px;border:0;border-radius:12px;font-size:17px;font-weight:800;color:#1a1020;background:linear-gradient(90deg,var(--accent2),var(--accent));cursor:pointer;font-family:inherit}
button.ghost{width:100%;padding:11px;margin-top:8px;border:1px solid rgba(255,255,255,.15);border-radius:12px;font-size:15px;font-weight:700;color:var(--text);background:transparent;cursor:pointer;font-family:inherit}
button:active{transform:scale(.98)}
.help{color:var(--muted);font-size:12.5px;line-height:1.75;margin-top:16px}
.big{font-size:48px;font-weight:900;color:var(--accent);margin:2px 0 6px}
.row{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:14px;margin-bottom:18px}
.row b{color:var(--text)}
#boostBtn{display:none}
#toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);font-size:24px;font-weight:900;color:var(--accent);opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.7);white-space:nowrap}
@media (pointer:coarse){
  #boostBtn{display:flex;position:fixed;left:18px;bottom:96px;width:78px;height:78px;border-radius:50%;background:rgba(255,93,115,.35);border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:800;font-size:15px;align-items:center;justify-content:center;z-index:5}
  #boostBtn.on{background:rgba(255,93,115,.7)}
  #mini{width:96px;height:96px}
  #board{min-width:130px;font-size:11px;padding:8px 10px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="stats" class="hud"></div>
<div id="board" class="hud"><h3>순위</h3><ol id="boardList"></ol></div>
<canvas id="mini" class="hud"></canvas>
<div id="boostBtn">부스트</div>
<div id="toast"></div>

<div id="menu" class="overlay">
  <div class="card">
    <div class="title">꿈틀 아레나</div>
    <div class="sub">먹고, 자라고, 가로막아라!</div>
    <input id="name" maxlength="12" placeholder="닉네임 입력" autocomplete="off">
    <div class="swatches" id="swatches"></div>
    <button class="play" id="playBtn">시작하기</button>
    <div class="help">
      🖱️ 마우스 방향으로 이동 · 클릭 또는 <b>스페이스</b> = 부스트<br>
      📱 화면을 터치해 방향 조절 · 왼쪽 버튼 = 부스트<br>
      머리가 다른 지렁이 몸에 닿으면 끝! 상대를 가로막아 보세요.
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div class="sub" id="deathMsg" style="margin:0 0 4px">앗, 부딪혔어요!</div>
    <div class="big" id="finalLen">0</div>
    <div class="row"><span>처치 <b id="finalKills">0</b></span><span>최고 기록 <b id="bestLen">0</b></span></div>
    <button class="play" id="againBtn">다시 하기</button>
    <button class="ghost" id="homeBtn">처음으로</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- 설정 ----------
const TAU = Math.PI * 2;
const WORLD_R = 3000;
const BOT_COUNT = 24;
const FOOD_TARGET = 1100;
const BASE_SPEED = 175;
const BOOST_SPEED = 360;
const START_SCORE = 14;
const PALETTES = [
  ['#ff5d73', '#ffd166'], ['#06d6a0', '#118ab2'], ['#8338ec', '#ff006e'],
  ['#ffbe0b', '#fb5607'], ['#3a86ff', '#8ecae6'], ['#80ed99', '#38a3a5'],
  ['#f15bb5', '#fee440'], ['#e0e1dd', '#778da9'], ['#ff9f1c', '#2ec4b6'],
];
const BOT_NAMES = ['꼬물이','지렁왕','느림보','번개','초코','말랑이','쭉쭉이','구불구불','밤톨','새싹','두부','라면',
  '호떡','감자','먹보','꿈틀대장','고구마','미역','도토리','젤리','통통이','모찌','바람','은하수','콩떡','방울','솜사탕','단무지'];

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 캔버스 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  const ms = mini.clientWidth || 130;
  mini.width = Math.round(ms * DPR); mini.height = Math.round(ms * DPR);
}
addEventListener('resize', resize);
resize();

// 육각 타일 배경 패턴
const pattern = (() => {
  const s = 24, w = 42, h = 72;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#0d1322'; g.fillRect(0, 0, w, h);
  const hex = (cx, cy) => {
    const k = 0.9, hw = w / 2 * k, hs = s * k;
    g.beginPath();
    g.moveTo(cx, cy - hs); g.lineTo(cx + hw, cy - hs / 2); g.lineTo(cx + hw, cy + hs / 2);
    g.lineTo(cx, cy + hs); g.lineTo(cx - hw, cy + hs / 2); g.lineTo(cx - hw, cy - hs / 2);
    g.closePath(); g.fillStyle = '#131b2e'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.025)'; g.lineWidth = 1; g.stroke();
  };
  hex(w / 2, s); hex(0, 2.5 * s); hex(w, 2.5 * s); hex(0, -0.5 * s); hex(w, -0.5 * s);
  return ctx.createPattern(c, 'repeat');
})();

// ---------- 상태 ----------
let worms = [];
let foods = [];
let player = null;
let state = 'menu';
let time = 0;
let respawnTimers = [];
let cam = { x: 0, y: 0, z: 1 };
let camFocus = null;
let view = { l: 0, t: 0, r: 0, b: 0 };
let chosenPal = 0;
let best = 0;
try { best = +localStorage.getItem('wiggle-best') || 0; } catch (e) {}

// ---------- 먹이 ----------
function makeFood(x, y, v, color) {
  return { x, y, v, r: 3 + Math.min(8, v * 0.9), color: color || `hsl(${(Math.random() * 360) | 0} 90% 62%)`, ph: Math.random() * TAU };
}
function spawnAmbientFood() {
  const a = Math.random() * TAU, d = Math.sqrt(Math.random()) * (WORLD_R - 40);
  foods.push(makeFood(Math.cos(a) * d, Math.sin(a) * d, rand(1, 2.6)));
}

// ---------- 지렁이 ----------
class Worm {
  constructor(x, y, ang, name, pal, isPlayer, score) {
    this.name = name; this.pal = pal; this.isPlayer = isPlayer;
    this.score = score; this.angle = ang; this.target = ang;
    this.boost = false; this.boosting = false; this.alive = true; this.kills = 0;
    this.dropT = 0; this.thinkT = 0; this.wanderT = 0; this.aggr = Math.random() * 0.7;
    const n = this.targetLen(), sp = this.spacing();
    this.segs = [];
    for (let i = 0; i < n; i++) this.segs.push({ x: x - Math.cos(ang) * i * sp, y: y - Math.sin(ang) * i * sp });
  }
  radius() { return Math.min(28, 7 + Math.sqrt(this.score) * 0.5); }
  spacing() { return this.radius() * 0.6; }
  targetLen() { return Math.min(900, Math.floor(20 + this.score * 0.35)); }
  turnRate() { return Math.max(2.2, 5.4 - this.radius() * 0.1); }

  update(dt) {
    const d = angDiff(this.angle, this.target);
    const mt = this.turnRate() * dt;
    this.angle += clamp(d, -mt, mt);

    this.boosting = this.boost && this.score > 10;
    const speed = this.boosting ? BOOST_SPEED : BASE_SPEED;
    if (this.boosting) {
      this.score -= 9 * dt;
      this.dropT += dt;
      if (this.dropT > 0.1) {
        this.dropT = 0;
        const t = this.segs[this.segs.length - 1];
        foods.push(makeFood(t.x + rand(-4, 4), t.y + rand(-4, 4), 0.75, this.pal[0]));
      }
    }

    const h = this.segs[0];
    h.x += Math.cos(this.angle) * speed * dt;
    h.y += Math.sin(this.angle) * speed * dt;
    const sp = this.spacing();
    for (let i = 1; i < this.segs.length; i++) {
      const a = this.segs[i - 1], b = this.segs[i];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dd = Math.hypot(dx, dy);
      if (dd > sp) { const k = (dd - sp) / dd; b.x += dx * k; b.y += dy * k; }
    }
    const tl = this.targetLen();
    while (this.segs.length < tl) { const t = this.segs[this.segs.length - 1]; this.segs.push({ x: t.x, y: t.y }); }
    while (this.segs.length > tl) this.segs.pop();
  }

  // 봇 AI
  think() {
    const h = this.segs[0], r = this.radius();
    const ca = Math.cos(this.angle), sa = Math.sin(this.angle);
    this.boost = false;

    // 1) 경계 회피
    if (Math.hypot(h.x, h.y) > WORLD_R - 220 - r * 3) {
      this.target = Math.atan2(-h.y, -h.x) + rand(-0.4, 0.4);
      return;
    }

    // 2) 다른 지렁이 몸 회피
    const look = 110 + r * 4, look2 = look * look;
    let ax = 0, ay = 0, threat = 0;
    for (const o of worms) {
      if (o === this || !o.alive) continue;
      const oh = o.segs[0];
      const bound = look + o.segs.length * o.spacing();
      const dx0 = oh.x - h.x, dy0 = oh.y - h.y;
      if (dx0 * dx0 + dy0 * dy0 > bound * bound) continue;
      const step = o.segs.length > 60 ? 2 : 1;
      for (let i = 0; i < o.segs.length; i += step) {
        const s = o.segs[i];
        const dx = s.x - h.x, dy = s.y - h.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > look2 || d2 < 1) continue;
        const d = Math.sqrt(d2);
        const dot = (dx * ca + dy * sa) / d;
        if (dot < -0.3) continue;
        const wgt = (1 - d / look) * (1 + dot);
        ax -= dx / d * wgt; ay -= dy / d * wgt;
        if (wgt > threat) threat = wgt;
      }
    }
    if (threat > 0.15) {
      this.target = Math.atan2(ay + sa * 0.2, ax + ca * 0.2);
      if (threat > 1.1 && this.score > 30 && Math.random() < 0.5) this.boost = true;
      return;
    }

    // 3) 사냥: 자기보다 작은 지렁이 앞을 가로막기
    if (this.score > 60 && Math.random() < this.aggr * 0.5) {
      let prey = null, bestD = 600 * 600;
      for (const o of worms) {
        if (o === this || !o.alive || o.score > this.score * 1.2) continue;
        const oh = o.segs[0];
        const d2 = (oh.x - h.x) ** 2 + (oh.y - h.y) ** 2;
        if (d2 < bestD) { bestD = d2; prey = o; }
      }
      if (prey) {
        const ph = prey.segs[0], lead = 120 + prey.radius() * 3;
        const tx = ph.x + Math.cos(prey.angle) * lead, ty = ph.y + Math.sin(prey.angle) * lead;
        this.target = Math.atan2(ty - h.y, tx - h.x);
        if (this.score > 40 && Math.random() < 0.4) this.boost = true;
        return;
      }
    }

    // 4) 먹이 찾기
    let bestF = null, bs = 0;
    const fr = 420;
    for (const f of foods) {
      const dx = f.x - h.x, dy = f.y - h.y;
      if (Math.abs(dx) > fr || Math.abs(dy) > fr) continue;
      const d = Math.hypot(dx, dy) + 20;
      const dot = (dx * ca + dy * sa) / d;
      if (dot < 0 && d < 140) continue; // 회전 반경 안쪽 먹이 주위를 맴도는 것 방지
      const sc = f.v / d * (1.4 + dot);
      if (sc > bs) { bs = sc; bestF = f; }
    }
    if (bestF) { this.target = Math.atan2(bestF.y - h.y, bestF.x - h.x); return; }

    // 5) 배회
    if (--this.wanderT <= 0) { this.target = this.angle + rand(-1.2, 1.2); this.wanderT = (rand(5, 15)) | 0; }
  }
}

function safeSpawnPoint(minDist) {
  let bestP = null, bestScore = -1;
  for (let t = 0; t < 30; t++) {
    const a = Math.random() * TAU, d = Math.sqrt(Math.random()) * WORLD_R * 0.7;
    const x = Math.cos(a) * d, y = Math.sin(a) * d;
    let nearest = Infinity;
    for (const w of worms) {
      if (!w.alive) continue;
      for (let i = 0; i < w.segs.length; i += 4) {
        const s = w.segs[i];
        const dd = Math.hypot(s.x - x, s.y - y);
        if (dd < nearest) nearest = dd;
      }
    }
    if (nearest > minDist) return { x, y };
    if (nearest > bestScore) { bestScore = nearest; bestP = { x, y }; }
  }
  return bestP;
}

function spawnBot() {
  const p = safeSpawnPoint(350);
  const score = Math.random() < 0.15 ? rand(150, 400) : rand(10, 60);
  const ang = Math.atan2(-p.y, -p.x) + rand(-1, 1);
  worms.push(new Worm(p.x, p.y, ang, pick(BOT_NAMES), pick(PALETTES), false, score));
}

// ---------- 먹기 / 충돌 ----------
function eat(w, dt) {
  const h = w.segs[0], r = w.radius();
  const reach = r * 2 + 30;
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    const dx = f.x - h.x, dy = f.y - h.y;
    if (dx > reach || dx < -reach || dy > reach || dy < -reach) continue;
    const d = Math.hypot(dx, dy);
    if (d < r + f.r + 2) {
      w.score += f.v;
      foods[i] = foods[foods.length - 1]; foods.pop();
    } else if (d < reach) {
      const pull = Math.min(d, 220 * dt);
      f.x -= dx / d * pull; f.y -= dy / d * pull;
    }
  }
}

function kill(w, killer) {
  w.alive = false;
  const r = w.radius(), n = w.segs.length;
  const count = Math.ceil(n / 2);
  const v = Math.max(0.8, (w.score * 0.7) / count);
  for (let i = 0; i < n; i += 2) {
    const s = w.segs[i];
    foods.push(makeFood(s.x + rand(-r, r) * 0.6, s.y + rand(-r, r) * 0.6, v, (i / 2) % 2 ? w.pal[1] : w.pal[0]));
  }
  if (killer) {
    killer.kills++;
    if (killer.isPlayer) toast(`${w.name} 처치! 🎉`);
  }
  if (w.isPlayer) onPlayerDeath(killer);
  else respawnTimers.push(time + rand(1.5, 4));
}

function checkDeaths() {
  for (const a of worms) {
    if (!a.alive) continue;
    const h = a.segs[0], ra = a.radius();
    if (Math.hypot(h.x, h.y) > WORLD_R - ra) { kill(a, null); continue; }
    for (const b of worms) {
      if (b === a || !b.alive) continue;
      const rb = b.radius(), bh = b.segs[0];
      const bound = b.segs.length * b.spacing() + ra + rb + 10;
      const dx = bh.x - h.x, dy = bh.y - h.y;
      if (dx * dx + dy * dy > bound * bound) continue;
      const lim = (ra + rb) * 0.85, lim2 = lim * lim;
      let hit = false;
      for (let i = 0; i < b.segs.length; i++) {
        const s = b.segs[i];
        const ex = s.x - h.x, ey = s.y - h.y;
        if (ex * ex + ey * ey < lim2) { hit = true; break; }
      }
      if (hit) { kill(a, b); break; }
    }
  }
}

// ---------- 입력 ----------
let pointerX = 0, pointerY = 0, hasPointer = false;
let mouseBoost = false, keyBoost = false, touchBoost = false;
canvas.addEventListener('pointermove', e => { pointerX = e.clientX; pointerY = e.clientY; hasPointer = true; });
canvas.addEventListener('pointerdown', e => {
  pointerX = e.clientX; pointerY = e.clientY; hasPointer = true;
  if (e.pointerType === 'mouse' && e.button === 0) mouseBoost = true;
});
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') mouseBoost = false; });
addEventListener('blur', () => { mouseBoost = keyBoost = touchBoost = false; });
addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') { keyBoost = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') keyBoost = false; });
const boostBtn = document.getElementById('boostBtn');
const setTouchBoost = v => e => { e.preventDefault(); e.stopPropagation(); touchBoost = v; boostBtn.classList.toggle('on', v); };
boostBtn.addEventListener('pointerdown', setTouchBoost(true));
boostBtn.addEventListener('pointerup', setTouchBoost(false));
boostBtn.addEventListener('pointercancel', setTouchBoost(false));
boostBtn.addEventListener('pointerleave', setTouchBoost(false));

// ---------- UI ----------
const $ = id => document.getElementById(id);
const menuEl = $('menu'), overEl = $('over'), nameEl = $('name');
try { nameEl.value = localStorage.getItem('wiggle-name') || ''; chosenPal = +(localStorage.getItem('wiggle-pal') || 0) % PALETTES.length; } catch (e) {}
PALETTES.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'sw' + (i === chosenPal ? ' on' : '');
  d.style.background = `linear-gradient(135deg, ${p[0]} 50%, ${p[1]} 50%)`;
  d.onclick = () => { chosenPal = i; document.querySelectorAll('.sw').forEach((s, j) => s.classList.toggle('on', j === i)); };
  $('swatches').appendChild(d);
});

let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 1300);
}

function startGame() {
  const name = nameEl.value.trim() || '나';
  try { localStorage.setItem('wiggle-name', nameEl.value.trim()); localStorage.setItem('wiggle-pal', chosenPal); } catch (e) {}
  const p = safeSpawnPoint(500);
  player = new Worm(p.x, p.y, Math.atan2(-p.y, -p.x), name, PALETTES[chosenPal], true, START_SCORE);
  worms.push(player);
  camFocus = player;
  pointerX = W / 2 + Math.cos(player.angle) * 100; pointerY = H / 2 + Math.sin(player.angle) * 100;
  state = 'play';
  menuEl.classList.add('hidden'); overEl.classList.add('hidden');
  nameEl.blur();
}

function onPlayerDeath(killer) {
  state = 'dead';
  camFocus = killer && killer.alive ? killer : null;
  const len = Math.floor(player.score);
  if (len > best) { best = len; try { localStorage.setItem('wiggle-best', best); } catch (e) {} }
  $('finalLen').textContent = len;
  $('finalKills').textContent = player.kills;
  $('bestLen').textContent = best;
  $('deathMsg').textContent = killer ? `${killer.name}에게 부딪혔어요!` : '경계에 부딪혔어요!';
  setTimeout(() => { if (state === 'dead') overEl.classList.remove('hidden'); }, 900);
}

$('playBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('homeBtn').onclick = () => { state = 'menu'; overEl.classList.add('hidden'); menuEl.classList.remove('hidden'); };
nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

let hudT = 0;
function updateHud() {
  const sorted = worms.filter(w => w.alive).sort((a, b) => b.score - a.score);
  const list = $('boardList');
  let html = '';
  sorted.slice(0, 10).forEach((w, i) => {
    html += `<li class="${w.isPlayer ? 'me' : ''}"><span>${i + 1}. ${escapeHtml(w.name)}</span><span>${Math.floor(w.score)}</span></li>`;
  });
  if (player && player.alive && state === 'play') {
    const rank = sorted.indexOf(player) + 1;
    if (rank > 10) html += `<li class="me"><span>${rank}. ${escapeHtml(player.name)}</span><span>${Math.floor(player.score)}</span></li>`;
    $('stats').innerHTML = `길이 <b>${Math.floor(player.score)}</b><br>처치 ${player.kills} · 순위 ${rank}/${sorted.length}`;
  } else {
    $('stats').innerHTML = '';
  }
  list.innerHTML = html;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- 업데이트 ----------
function step(dt) {
  time += dt;

  if (state === 'play' && player.alive) {
    const dx = pointerX - W / 2, dy = pointerY - H / 2;
    if (hasPointer && dx * dx + dy * dy > 100) player.target = Math.atan2(dy, dx);
    player.boost = mouseBoost || keyBoost || touchBoost;
  }

  for (const w of worms) {
    if (!w.alive || w.isPlayer) continue;
    w.thinkT -= dt;
    if (w.thinkT <= 0) { w.think(); w.thinkT = rand(0.08, 0.18); }
  }
  for (const w of worms) if (w.alive) { w.update(dt); eat(w, dt); }
  checkDeaths();
  worms = worms.filter(w => w.alive);

  // 봇 리스폰
  for (let i = respawnTimers.length - 1; i >= 0; i--) {
    if (respawnTimers[i] <= time) { respawnTimers.splice(i, 1); spawnBot(); }
  }
  // 먹이 보충 / 상한
  for (let k = 0; k < 25 && foods.length < FOOD_TARGET; k++) spawnAmbientFood();
  if (foods.length > 4000) foods.splice(0, foods.length - 4000);

  // 카메라
  if (!camFocus || !camFocus.alive) {
    if (state !== 'dead' || !camFocus) {
      let top = null;
      for (const w of worms) if (!top || w.score > top.score) top = w;
      camFocus = state === 'dead' ? null : top;
    }
  }
  if (camFocus) {
    const h = camFocus.segs[0];
    const k = 1 - Math.pow(0.0001, dt);
    cam.x += (h.x - cam.x) * k; cam.y += (h.y - cam.y) * k;
  }
  const base = clamp(Math.min(W, H) / 850, 0.55, 1.3);
  const r = camFocus ? camFocus.radius() : 10;
  const tz = base * clamp(1.05 - (r - 7) * 0.02, 0.6, 1.05);
  cam.z += (tz - cam.z) * (1 - Math.pow(0.05, dt));

  hudT -= dt;
  if (hudT <= 0) { hudT = 0.25; updateHud(); }
}

// ---------- 렌더링 ----------
const inView = (x, y, m) => x > view.l - m && x < view.r + m && y > view.t - m && y < view.b + m;

function drawWorm(w) {
  const segs = w.segs, n = segs.length, r = w.radius();
  const [c1, c2] = w.pal;

  if (w.boosting) {
    ctx.globalAlpha = 0.18 + 0.08 * Math.sin(time * 20);
    ctx.fillStyle = c1;
    ctx.beginPath();
    for (let i = n - 1; i >= 0; i -= 2) { const s = segs[i]; if (!inView(s.x, s.y, r * 2)) continue; ctx.moveTo(s.x + r * 1.7, s.y); ctx.arc(s.x, s.y, r * 1.7, 0, TAU); }
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 외곽선
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  for (let i = n - 1; i >= 0; i--) { const s = segs[i]; if (!inView(s.x, s.y, r)) continue; ctx.moveTo(s.x + r + 2, s.y); ctx.arc(s.x, s.y, r + 2, 0, TAU); }
  ctx.fill();

  // 몸통 줄무늬
  for (let i = n - 1; i >= 0; i--) {
    const s = segs[i];
    if (!inView(s.x, s.y, r)) continue;
    ctx.fillStyle = ((i / 4) | 0) & 1 ? c2 : c1;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
  }
  // 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath();
  for (let i = n - 1; i >= 0; i -= 2) { const s = segs[i]; if (!inView(s.x, s.y, r)) continue; const hx = s.x - r * 0.3, hy = s.y - r * 0.3; ctx.moveTo(hx + r * 0.4, hy); ctx.arc(hx, hy, r * 0.4, 0, TAU); }
  ctx.fill();

  // 눈
  const h = segs[0], a = w.angle;
  if (inView(h.x, h.y, r * 2)) {
    const ex = Math.cos(a), ey = Math.sin(a), px = -ey, py = ex;
    const la = w.target;
    for (const side of [-1, 1]) {
      const cx = h.x + ex * r * 0.35 + px * r * 0.45 * side;
      const cy = h.y + ey * r * 0.35 + py * r * 0.45 * side;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.34, 0, TAU); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx + Math.cos(la) * r * 0.13, cy + Math.sin(la) * r * 0.13, r * 0.18, 0, TAU); ctx.fill();
    }
    // 이름
    ctx.font = `600 ${12 / cam.z}px "Malgun Gothic", system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = w.isPlayer ? 'rgba(255,209,102,0.95)' : 'rgba(232,236,247,0.75)';
    ctx.fillText(w.name, h.x, h.y - r - 10 / cam.z);
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0b0f1a';
  ctx.fillRect(0, 0, W, H);

  const z = cam.z;
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z), DPR * (H / 2 - cam.y * z));
  const vl = cam.x - W / 2 / z, vt = cam.y - H / 2 / z, vw = W / z, vh = H / z;
  view = { l: vl, t: vt, r: vl + vw, b: vt + vh };

  ctx.fillStyle = pattern;
  ctx.fillRect(vl, vt, vw, vh);

  // 경계 밖
  ctx.beginPath();
  ctx.rect(vl, vt, vw, vh);
  ctx.arc(0, 0, WORLD_R, 0, TAU, true);
  ctx.fillStyle = 'rgba(40,0,12,0.75)';
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, WORLD_R, 0, TAU);
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,93,115,0.55)'; ctx.stroke();

  // 먹이
  ctx.globalCompositeOperation = 'lighter';
  for (const f of foods) {
    if (!inView(f.x, f.y, 30)) continue;
    const pr = f.r * (1 + 0.15 * Math.sin(time * 3 + f.ph));
    ctx.fillStyle = f.color;
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(f.x, f.y, pr * 2.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(f.x, f.y, pr, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  for (const w of worms) if (!w.isPlayer) drawWorm(w);
  if (player && player.alive) drawWorm(player);

  drawMinimap();
}

function drawMinimap() {
  const s = mini.width, c = s / 2, k = (s / 2 - 4) / WORLD_R;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, s, s);
  mctx.fillStyle = 'rgba(14,20,36,0.7)';
  mctx.beginPath(); mctx.arc(c, c, s / 2 - 2, 0, TAU); mctx.fill();
  mctx.strokeStyle = 'rgba(255,93,115,0.6)'; mctx.lineWidth = 2 * DPR; mctx.stroke();
  for (const w of worms) {
    const h = w.segs[0];
    if (w.isPlayer) continue;
    mctx.fillStyle = 'rgba(232,236,247,0.45)';
    mctx.beginPath(); mctx.arc(c + h.x * k, c + h.y * k, (1 + w.radius() * 0.08) * DPR, 0, TAU); mctx.fill();
  }
  if (player && player.alive) {
    const h = player.segs[0];
    mctx.fillStyle = '#ffd166';
    mctx.beginPath(); mctx.arc(c + h.x * k, c + h.y * k, 3.2 * DPR, 0, TAU); mctx.fill();
  }
}

// ---------- 시작 ----------
for (let i = 0; i < BOT_COUNT; i++) spawnBot();
for (let i = 0; i < FOOD_TARGET; i++) spawnAmbientFood();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
